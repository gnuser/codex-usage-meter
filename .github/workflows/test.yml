name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: node tests/test_charts.js
      - run: node --check web/panel.js
      - if: runner.os == 'Windows'
        run: python -m pip install -r native/requirements-windows.txt
      - run: python native/build.py
      - if: runner.os == 'Windows'
        run: python tests/windows_smoke.py
