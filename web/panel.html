<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex Usage</title>
    <link rel="stylesheet" href="/panel.css" />
    <script src="/chart-math.js" defer></script>
    <script src="/quota-summary.js" defer></script>
    <script src="/tibo.js" defer></script>
    <script src="/panel.js" defer></script>
    <script src="/panel-size.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <button id="activityCount" title="Updated in the last 30 minutes · Click to refresh">Active —</button
        ><button id="quotaSummary" title="Account allowance · Show or hide reset details">Left —</button>
      </header>
      <div id="resetSummary" aria-live="polite">Reset —</div>
      <div id="sessionCards" aria-label="Recent conversation usage"></div>
      <p id="status" role="status" hidden></p>
      <section id="tibo">
        <button id="tiboToggle" aria-expanded="false">Tibo · Loading ▸</button>
        <div id="tiboDetails" hidden></div>
      </section>
      <footer id="resetStatus">Resets —</footer>
    </main>
  </body>
</html>
