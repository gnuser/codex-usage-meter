<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>Tibo 连接</title>
  <link rel="stylesheet" href="popup.css" />
  <h3>Tibo · Chrome 采集</h3>
  <p>
    粘贴本机用量面板的完整地址（含 # 后内容）。只发送 Tibo
    的主题帖子（不含回复或转发）到本机，不读取 Cookie。
  </p>
  <input
    id="address"
    type="password"
    placeholder="http://127.0.0.1:…/panel#…"
    aria-label="本机面板地址"
  />
  <button id="connect">连接并开始</button
  ><button id="refresh">立即更新</button
  ><button id="stop">停止</button>
  <p id="status" role="status">尚未连接</p>
  <p>
    保持 Chrome 运行；一个主题帖子专用 X 标签每 30
    分钟刷新。服务重启后需重新连接。
  </p>
  <script src="popup.js"></script>
</html>
